databases:
  - name: adaptiq-db
    databaseName: adaptiq
    user: adaptiq
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: adaptiq-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/database
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adaptiq-db
          property: connectionString
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: adaptiq-web
          property: host
      - key: AUTH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - type: web
    name: adaptiq-web
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: adaptiq-api
          property: host
      - key: VITE_USE_LIVE_QUESTIONS
        value: "true"
